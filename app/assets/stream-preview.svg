<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Virtual camera preview">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2430"/>
      <stop offset=".55" stop-color="#101720"/>
      <stop offset="1" stop-color="#0a0f16"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2b22"/>
      <stop offset="1" stop-color="#221913"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a1e"/>
      <stop offset=".5" stop-color="#123c2a"/>
      <stop offset="1" stop-color="#0a1f17"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9a0" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#ffc46b" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffc46b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c3442"/>
      <stop offset="1" stop-color="#141922"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#wall)"/>
  <circle cx="1060" cy="96" r="280" fill="url(#lamp)"/>

  <!-- shelf -->
  <rect x="0" y="250" width="1280" height="10" rx="4" fill="#0d1218"/>
  <rect x="120" y="150" width="22" height="100" rx="6" fill="#2c3a2c"/>
  <circle cx="131" cy="140" r="46" fill="#1f4d33"/>
  <circle cx="100" cy="160" r="34" fill="#2c6844"/>
  <circle cx="164" cy="158" r="30" fill="#25593b"/>
  <rect x="260" y="176" width="150" height="74" rx="6" fill="#1a2230" stroke="#2a3648"/>
  <rect x="272" y="188" width="126" height="8" rx="3" fill="#33445c"/>
  <rect x="272" y="204" width="96" height="6" rx="3" fill="#2a3648"/>
  <rect x="272" y="216" width="112" height="6" rx="3" fill="#2a3648"/>

  <!-- desk -->
  <rect x="0" y="470" width="1280" height="250" fill="url(#desk)"/>
  <rect x="0" y="470" width="1280" height="6" fill="#54392b" opacity=".7"/>

  <!-- monitor -->
  <rect x="420" y="150" width="560" height="330" rx="16" fill="#0a0e13" stroke="#232c38" stroke-width="4"/>
  <rect x="440" y="170" width="520" height="272" rx="8" fill="url(#screen)"/>
  <g opacity=".92">
    <rect x="466" y="196" width="140" height="10" rx="4" fill="#4ade9a" opacity=".8"/>
    <rect x="466" y="218" width="300" height="7" rx="3" fill="#2e7d5b"/>
    <rect x="466" y="233" width="252" height="7" rx="3" fill="#2e7d5b"/>
    <rect x="466" y="262" width="200" height="132" rx="8" fill="#0c2b20" stroke="#2e7d5b" stroke-opacity=".5"/>
    <rect x="684" y="262" width="250" height="60" rx="8" fill="#0c2b20" stroke="#2e7d5b" stroke-opacity=".4"/>
    <rect x="684" y="334" width="118" height="60" rx="8" fill="#0c2b20" stroke="#2e7d5b" stroke-opacity=".4"/>
    <rect x="816" y="334" width="118" height="60" rx="8" fill="#0c2b20" stroke="#2e7d5b" stroke-opacity=".4"/>
  </g>
  <rect x="660" y="480" width="80" height="60" fill="#141a22"/>
  <rect x="590" y="536" width="220" height="12" rx="6" fill="#1a2230"/>

  <!-- phone on stand -->
  <g transform="translate(150 300) rotate(-6)">
    <rect x="0" y="0" width="150" height="300" rx="24" fill="url(#phone)" stroke="#39445a" stroke-width="3"/>
    <rect x="10" y="12" width="130" height="276" rx="16" fill="#0b1420"/>
    <rect x="22" y="34" width="106" height="14" rx="5" fill="#1d4d38"/>
    <rect x="22" y="58" width="72" height="10" rx="4" fill="#163a2b"/>
    <rect x="22" y="84" width="106" height="64" rx="8" fill="#123c2a" stroke="#2e7d5b" stroke-opacity=".45"/>
    <rect x="22" y="158" width="106" height="42" rx="8" fill="#12202e"/>
    <rect x="22" y="210" width="50" height="34" rx="8" fill="#12202e"/>
    <rect x="78" y="210" width="50" height="34" rx="8" fill="#12202e"/>
    <circle cx="75" cy="276" r="5" fill="#2e3b4d"/>
  </g>

  <!-- keyboard -->
  <g transform="translate(700 560)">
    <rect x="0" y="0" width="430" height="112" rx="12" fill="#171d26" stroke="#2b3544" stroke-width="2"/>
    <g fill="#242e3b">
      <rect x="18" y="16" width="394" height="20" rx="4"/>
      <rect x="18" y="44" width="394" height="20" rx="4"/>
      <rect x="18" y="72" width="250" height="20" rx="4"/>
      <rect x="280" y="72" width="132" height="20" rx="4"/>
    </g>
    <g fill="#39465a" opacity=".55">
      <rect x="28" y="21" width="12" height="10" rx="2"/><rect x="46" y="21" width="12" height="10" rx="2"/>
      <rect x="64" y="21" width="12" height="10" rx="2"/><rect x="82" y="21" width="12" height="10" rx="2"/>
      <rect x="100" y="21" width="12" height="10" rx="2"/><rect x="118" y="21" width="12" height="10" rx="2"/>
    </g>
  </g>

  <!-- mug -->
  <g transform="translate(1090 470)">
    <ellipse cx="60" cy="120" rx="70" ry="12" fill="#0b0908" opacity=".6"/>
    <path d="M10 10h84v78c0 24-19 36-42 36S10 112 10 88z" fill="#c9ced6"/>
    <path d="M94 26h20c16 0 26 12 26 26s-10 26-26 26H94" fill="none" stroke="#c9ced6" stroke-width="10"/>
    <ellipse cx="52" cy="12" rx="42" ry="10" fill="#2b1d16"/>
    <g stroke="#e7ecf3" stroke-width="3" opacity=".5" fill="none">
      <path d="M38 -10c8 -12 -8 -20 0 -32"/>
      <path d="M62 -14c8 -12 -8 -20 0 -32"/>
    </g>
  </g>

  <!-- depth vignette -->
  <rect width="1280" height="720" fill="none"/>
  <rect width="1280" height="720" fill="url(#vignette)" opacity="0"/>
  <rect x="0" y="0" width="1280" height="720" fill="#000" opacity=".18"/>
  <rect x="0" y="0" width="1280" height="120" fill="#000" opacity=".18"/>

  <!-- watermark -->
  <g transform="translate(36 640)">
    <rect x="0" y="0" width="300" height="46" rx="23" fill="#000" opacity=".45"/>
    <circle cx="26" cy="23" r="6" fill="#3ddc84"/>
    <text x="44" y="29" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#dfe6ef">Android DEX · Camera</text>
  </g>
</svg>
